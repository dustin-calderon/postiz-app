# La puerta de custom/postiz-dc. Lo que llega a esta rama se despliega solo en
# el Beelink (docs/architecture/ARRANQUE_Y_SUPERVISION.md, «Despliegue»), así
# que lo que no pasa por aquí no debería fusionarse.
#
# Corre en cada push, a cualquier rama: el resultado se ata al commit, y una PR
# lo enseña aunque la haya abierto un workflow (los `pull_request` de una PR que
# abre GITHUB_TOKEN esperan a que alguien los apruebe). Es lo mismo que
# construye Dockerfile.dev, más los tests.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  puerta:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # desplegar.sh decide qué corre en producción y cuándo se vuelve atrás. Su
      # prueba usa un docker de mentira y tarda segundos. Va dentro de `puerta`,
      # que es el check que exige la protección de la rama.
      - run: bash docs/architecture/scripts/test_desplegar.sh

      # La versión de pnpm sale de `packageManager` y la de Node de `volta`,
      # las dos de package.json: las mismas que usa la imagen.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Jest corre las suites en un solo proceso (--detectOpenHandles) y ts-jest
      # guarda en memoria los tipos de cada proyecto. Con los de Temporal 1.25
      # el pico son 4,3 GB, por encima de los 4,2 GB que Node se da por defecto.
      - run: pnpm test
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - run: pnpm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
