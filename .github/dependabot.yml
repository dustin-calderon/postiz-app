# Dependabot — el fichero de la flota (Instalar-Home-Server, PLAN_APPS_PUBLICAS_PARCHEADAS.md §4.5).
#
# Sin él, Dependabot abre una PR de seguridad por aviso, a cuentagotas, y cada
# una lleva un pnpm-lock.yaml resuelto contra la rama del día en que nació: con
# el CI en verde puede devolver un paquete a una versión vulnerable. Aquí solo
# se decide esto:
#
#   · `groups` con `applies-to: security-updates`: la tanda entera en UNA PR.
#   · `open-pull-requests-limit: 0`: sin subidas rutinarias de versión. Declarar
#     el ecosistema las enciende; este cero las apaga y no toca las de seguridad.
#
# `directory: "/"` porque el único manifiesto con dependencias es el
# package.json de la raíz (monorepo pnpm con un solo pnpm-lock.yaml).
# La PR que abre se fusiona sola si pasa la puerta y no es un salto de mayor
# (workflows/dependabot-fusionar.yml, que dice qué lo hace seguro). Lo que se
# queda abierto se resuelve sobre custom/postiz-dc con la skill sanar-dependencias.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      seguridad:
        applies-to: security-updates
        patterns:
          - "*"

  # Los workflows de .github/workflows usan acciones de terceros, y GitHub da
  # avisos de ellas: sin este bloque, sus arreglos llegarían en PR sueltas.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      seguridad:
        applies-to: security-updates
        patterns:
          - "*"
